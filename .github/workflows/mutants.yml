# Mutation checks (#1578): scripts/mutants/run.py runs the lists in
# scripts/mutants/lists/ (format in scripts/mutants/README.md). Every night, the same 7 days a week: the
# lists whose files changed in the last 25 h plus the weekday's rotation slice (entry % 7, see README), in
# ONE wave of at most 3 shards (#1884; operator 2026-11-19: the full run was too slow), each sized by
# estimated time (run.py EST_LIST/EST_MUTANT) to fit the step's --budget; order: broken anchor, changed list JSON, the slice, other changed
# lists (README); what does not fit waits for its rotation day. workflow_dispatch: the given glob, one wave of at most 4 shards (overflow deferred). Per list the filter
# runs once unmutated, then each mutant is applied, built, tested and restored.
# A "killed" mutant that survives, or a broken or hung one, turns the job red;
# red runs are fixed later (operator 2026-11-18: "we fix them retroactively").
#
# Same xcode-27 image, Xcode selection, SDKROOT and SpM dependency cache key as
# test.yml, so the warm caches hit. Runs with --filter only, so test.yml's --skip
# list does not apply. The debug build tree is restored, never saved: test.yml
# owns that key.
name: mutants

on:
  schedule:
    # One schedule; FULL (plan) and max-parallel (mutants) tell it from workflow_dispatch by event_name.
    - cron: "30 3 * * *" # nightly 03:30 UTC, off-peak, after heavy.yml: changed lists + rotation slice
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to check out
        default: main
      lists:
        description: Glob under scripts/mutants/lists/ (e.g. 1567.json)
        default: "*.json"

permissions:
  contents: read

concurrency:
  group: mutants-${{ inputs.ref || 'main' }}
  cancel-in-progress: false

jobs:
  plan:
    if: ${{ github.repository == 'ventsislav-georgiev/prosper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || 'main' }}
          fetch-depth: 0 # the nightly diff needs history

      - name: Shard the lists
        id: plan
        env:
          LISTS: ${{ inputs.lists || '*.json' }}
          # Only workflow_dispatch runs in full.
          FULL: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          if [[ "$FULL" == true ]]; then
            # As many shards as the estimate needs at 15000 s each (the Mutants step's --budget), at most
            # max-parallel (4): one wave; lists that do not fit are deferred (plan log and step summary).
            m=$(python3 -I scripts/mutants/run.py --plan --shards 4 --budget 15000 --lists "$LISTS")
          else
            # Last commit older than 25 h (the nightly period plus slack): simpler than asking the API
            # for the last green run; the weekly rotation slice catches what a failed night missed. No such
            # commit (empty) or an unknown rev: run.py counts every list as changed. One wave of at most 3
            # shards (max-parallel 3), never more than 3 x 15000 s by estimate; the UTC weekday picks the
            # slice; the overflow (lowest priority first) is deferred, listed in the log and the step summary.
            since=$(git rev-list -1 --before="25 hours ago" HEAD)
            m=$(python3 -I scripts/mutants/run.py --plan --shards 3 --budget 15000 --lists "$LISTS" --since "${since:-none}")
          fi
          echo "$m"
          echo "matrix=$m" >> "$GITHUB_OUTPUT"
          echo "count=$(python3 -I -c 'import json,sys; print(len(json.loads(sys.argv[1])["include"]))' "$m")" >> "$GITHUB_OUTPUT"

  mutants:
    needs: plan
    if: ${{ needs.plan.outputs.count > 0 }}
    runs-on: xcode-27 # same image as test.yml
    # Under the 6 h job cap; run.py's --budget ends first so the summary is written.
    timeout-minutes: 350
    strategy:
      fail-fast: false
      # Nightly: 3 of the account's 5 concurrent macOS jobs (03:30 UTC, nothing else runs then), 2 left for
      # CI or a release; the plan never makes more shards than this, so every run is one wave. Dispatch: 4.
      max-parallel: ${{ github.event_name == 'schedule' && 3 || 4 }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: mutants (shard ${{ matrix.shard }})
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Select Xcode 27 (Swift 6.4 toolchain)
        id: xcode
        run: |
          # Same selection as release.yml: pin the GA 27.0, not a 27.x beta.
          XC=/Applications/Xcode_27.app
          if [[ ! -d "$XC" ]]; then
            echo "::error::$XC not found on runner"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          sudo xcode-select -s "$XC/Contents/Developer"
          swift --version
          TC=$(swift --version 2>/dev/null | tr -d ' \n' | shasum -a 256 | cut -c1-12)
          echo "toolchain=$TC" >> "$GITHUB_OUTPUT"
          echo "image=${ImageVersion:-unset}" >> "$GITHUB_OUTPUT"

      - name: Cache SwiftPM dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5, restore only
        with:
          # Byte-identical to test.yml, release.yml and cache-warm.yml.
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: spm-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.toolchain }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift') }}
          restore-keys: |
            spm-deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.toolchain }}-
            spm-deps-v1-${{ runner.os }}-

      - name: Cache debug build tree
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5, restore only
        with:
          # test.yml's key family; restored as a warm start, saved only by test.yml.
          path: app/.build
          key: spm-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.toolchain }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift') }}-${{ steps.xcode.outputs.image }}
          restore-keys: |
            spm-test-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.toolchain }}-${{ hashFiles('app/Package.resolved', 'app/Package.swift') }}-

      - name: Build
        working-directory: app
        timeout-minutes: 45
        run: |
          # Once per job; each mutant then rebuilds incrementally inside run.py.
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"; export SDKROOT
          swift build --build-tests --disable-keychain --build-system native

      - name: Mutants
        # 250 min budget + one last mutant or list baseline (2 x 15 min) stays inside the step limit: past
        # the budget run.py starts no list baseline either (#1884), and writes NOT RUN rows and the summary.
        # Build (<= 45) + step (290) + setup stays inside the job's 350.
        timeout-minutes: 290
        env:
          NSUnbufferedIO: "YES"
          LISTS: ${{ matrix.lists }}
        run: |
          # run.py sets SDKROOT and PROSPER_HEAVY_TESTS=1 for every swift run itself.
          # shellcheck disable=SC2086 # LISTS is a space-separated list of repo paths
          python3 -I scripts/mutants/run.py --timeout 900 --budget 15000 --logs "$RUNNER_TEMP/mutants-logs" $LISTS
