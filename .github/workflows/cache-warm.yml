name: Warm SwiftPM Cache

# Populates the SwiftPM build + dependency cache under THIS repo's default-branch
# (main) ref scope so tagged-release runs in release.yml can restore it (GitHub
# Actions caches are ref-scoped: a tag run restores only from its own tag ref or
# the default branch). Without this warmer every release would build cold — an MLX
# build from scratch is very slow.
#
# Runs when app/Package.resolved changes on main (deps moved → cache stale), plus
# a weekly schedule + manual dispatch as a safety net.
#
# The cache key + path + restore-keys MUST stay byte-identical to release.yml's
# "Cache SwiftPM build + dependencies" step, or release runs won't hit it.

on:
  push:
    branches: [main]
    paths:
      - "app/Package.resolved"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm:
    if: ${{ github.repository == 'ventsislav-georgiev/prosper' }}
    runs-on: xcode-27 # same image as release.yml, or the key never matches
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode 27 (Swift 6.4 toolchain)
        id: xcode
        run: |
          # The image also carries 27.1/27.2 betas; pin the GA 27.0 (the local
          # toolchain) instead of version-sorting into a beta.
          XC=/Applications/Xcode_27.app
          if [[ ! -d "$XC" ]]; then
            echo "::error::$XC not found on runner"; ls -d /Applications/Xcode_*.app; exit 1
          fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          swift --version
          TC=$(swift --version 2>/dev/null | tr -d ' \n' | shasum -a 256 | cut -c1-12)
          echo "toolchain=$TC" >> "$GITHUB_OUTPUT"

      - name: Check image tools
        # Proves the preview image before a tag depends on it: the release steps
        # need gh (feeds), python3 (appcast merge), make and cc (dch), curl,
        # shasum and tar (Sparkle tools). A missing Metal toolchain only costs
        # the download build.sh does itself.
        run: |
          for t in gh python3 make cc curl shasum tar; do
            command -v "$t" >/dev/null || { echo "::error::$t missing on runner"; exit 1; }
          done
          xcrun metal --version >/dev/null 2>&1 || echo "::warning::Metal toolchain not installed; build.sh downloads it (~840 MB) if the metallib step runs"

      - name: Cache SwiftPM build + dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            app/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          # `v3` salt (#416): app/.build now holds the swiftbuild backend's out/ layout;
          # a v2 cache would restore a dead native-backend tree beside it.
          # `v2` salt: the cache now also carries the MLX metallib bundle staged by
          # build.sh. Bumping the prefix forces a one-time miss so this warmer re-saves
          # WITH the metallib (actions/cache skips saving on an exact-key hit, so the
          # old metallib-less v1 cache would otherwise stay frozen at the same key).
          # MUST stay byte-identical to release.yml's cache step.
          key: spm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.toolchain }}-${{ hashFiles('app/Package.resolved') }}
          restore-keys: |
            spm-v3-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.toolchain }}-
            spm-v3-${{ runner.os }}-

      - name: Build (release) to warm cache
        # Run the full build.sh (not bare `swift build`) so the warmed cache also
        # captures the MLX `default.metallib` bundle in app/.build/release. That
        # bundle comes from a ~6-minute one-shot xcodebuild that `swift build` can't
        # do; it's dependency-derived (arch-portable, config-independent, unaffected
        # by app source) so once cached it stays valid until Package.resolved changes
        # — which re-triggers this warmer. release.yml's Build step then finds it
        # already staged ("metallib already staged") and skips the xcodebuild compile.
        run: ./scripts/build.sh release

      - name: Check build output
        # app/.build/release is a symlink into the backend's product dir (#416);
        # bundle.sh reads through it, and the app aborts on the
        # first model load without the MLX metallib. Fail here, before any signing.
        run: |
          R=app/.build/release
          for f in "$R/ProsperApp" "$R/ProsperHelper" "$R/mlx-swift_Cmlx.bundle/Contents/Resources/default.metallib"; do
            [[ -f "$f" ]] || { echo "::error::$f missing after build.sh"; exit 1; }
          done
          echo "release -> $(readlink "$R" || echo '(dir)')"
