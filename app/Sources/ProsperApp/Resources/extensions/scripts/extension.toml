# Scripts — save shell commands under a name and run them from the palette.
# Raycast "Script Commands" parity, implemented as a pure-Lua system extension
# over host.shell + host.prefs storage (the quicklinks pattern).
[extension]
id          = "com.prosper.scripts"
name        = "scripts"
title       = "Scripts"
description = "Save shell commands and run them by name; each runs to completion, then shows its output."
version     = "1.0.0"
author      = "Prosper"
license     = "MIT"
icon        = "terminal"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

# Single no-view command; the leading `sc` verb is sub-parsed in Lua
# (run / list / help). Runs on the off-main async lane — host.shell is async.
[[contributes.commands]]
id          = "scripts.run"
title       = "Script"
description = "Run a saved script command (runs to completion, then shows its output)."
mode        = "no-view"
icon        = "terminal"
keywords    = ["sc", "script", "scripts", "run", "command", "shell"]
match       = "^sc( |$)"
# Runner-mode trigger: typing "sc " locks the launcher into this command, showing
# the "Script" chip and stripping the prefix from the visible query.
prefix      = "sc "
# List every saved script on an empty query, then filter as the user types
# (same as bm/sn).
list_on_empty = true

# Dynamic (Tier-B) settings: its own sidebar section, rendered by the extension's
# settings_render handler and edited via settings_action. The editable script list
# is a `records` control over the same host.prefs store the runner reads, so edits
# show up immediately. Copied 1:1 from quicklinks.
[[contributes.settings_sections]]
id        = "scripts"
title     = "Scripts"
icon      = "terminal"
accent    = "Scripts"
subtitle  = "Save shell commands; run them with sc <name>"
dynamic   = true
