[extension]
id          = "com.prosper.theme.indigo"
name        = "theme-indigo"
title       = "Indigo Theme"
description = "Indigo night with periwinkle and a warm amber counter-accent."
version     = "1.1.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.indigo"
title      = "Indigo"
path       = "theme.json"
appearance = "dark"
