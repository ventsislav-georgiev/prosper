[extension]
id          = "com.prosper.theme.gold"
name        = "theme-gold"
title       = "Gold Theme"
description = "Brushed brass on warm charcoal — muted metal, not amber's neon."
version     = "1.1.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.gold"
title      = "Gold"
path       = "theme.json"
appearance = "dark"
