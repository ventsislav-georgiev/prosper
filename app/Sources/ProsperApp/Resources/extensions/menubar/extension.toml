# Menu Bar Management — Ice/Bartender-style control of the menu bar: hide icons
# behind a chevron and reveal on demand, and customize icon spacing and chevron
# style. Implemented natively (MenuBarManager) over the private CGS window list —
# hide/spacing need NO permission. Icon ORDER is the native macOS ⌘-drag and the OS
# persists it; Prosper does not touch it (the opt-in ordering engine that used to
# live here was unreliable across macOS versions and was removed in 1.5.0).
[extension]
id          = "com.prosper.menubar"
name        = "menubar"
title       = "Menu Bar Management"
description = "Hide menu-bar icons behind a chevron, reveal on demand, and tune icon spacing and style."
version     = "1.5.0"
author      = "Prosper"
license     = "MIT"
icon        = "menubar.rectangle"
system      = true
# Opt-in: enabling this extension adds a chevron to the menu bar, so it ships OFF.
# The user turns it on in Settings › Extensions.
default_disabled = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

# This section has no declarative controls of its own — the rich controls
# (spacing slider, hiding toggles, chevron style, relaunch button, and a link to
# the reveal shortcut's row in Settings › Shortcuts, #119) render natively as the
# footer pane (MenuBarPane), same merge pattern as Window Management.
[[contributes.settings_sections]]
id        = "menubar"
title     = "Menu Bar Management"
icon      = "menubar.rectangle"
accent    = "Menu Bar"
subtitle  = "Hide, reveal, and space your menu-bar icons"
