[extension]
id          = "com.prosper.theme.graphite"
name        = "theme-graphite"
title       = "Graphite Theme"
description = "Monochrome graphite — calm steel grays, with just enough color to read status."
version     = "1.1.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.graphite"
title      = "Graphite"
path       = "theme.json"
appearance = "dark"
