[extension]
id          = "com.prosper.theme.silver"
name        = "theme-silver"
title       = "Silver Theme"
description = "Monochrome silver — quiet grays on bright white, status color kept legible."
version     = "1.1.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.silver"
title      = "Silver"
path       = "theme.json"
appearance = "light"
