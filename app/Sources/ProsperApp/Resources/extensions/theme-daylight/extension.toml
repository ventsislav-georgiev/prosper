[extension]
id          = "com.prosper.theme.daylight"
name        = "theme-daylight"
title       = "Daylight Theme"
description = "Crisp blue accents on airy white — the default, in daylight."
version     = "1.0.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.daylight"
title      = "Daylight"
path       = "theme.json"
appearance = "light"
