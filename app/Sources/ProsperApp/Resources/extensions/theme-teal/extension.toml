[extension]
id          = "com.prosper.theme.teal"
name        = "theme-teal"
title       = "Teal Theme"
description = "Cool teal lagoon on deep-sea black, lit by amber."
version     = "1.1.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.teal"
title      = "Teal"
path       = "theme.json"
appearance = "dark"
