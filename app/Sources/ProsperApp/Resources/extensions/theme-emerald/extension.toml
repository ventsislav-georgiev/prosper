[extension]
id          = "com.prosper.theme.emerald"
name        = "theme-emerald"
title       = "Emerald Theme"
description = "Emerald green on dark moss, with violet and pink counter-accents."
version     = "1.1.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.emerald"
title      = "Emerald"
path       = "theme.json"
appearance = "dark"
