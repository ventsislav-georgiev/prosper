[extension]
id          = "com.prosper.theme.fern"
name        = "theme-fern"
title       = "Fern Theme"
description = "Deep leaf green on pale sage — a woodland light theme."
version     = "1.0.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.fern"
title      = "Fern"
path       = "theme.json"
appearance = "light"
