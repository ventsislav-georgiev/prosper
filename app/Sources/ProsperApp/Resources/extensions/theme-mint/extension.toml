[extension]
id          = "com.prosper.theme.mint"
name        = "theme-mint"
title       = "Mint Theme"
description = "Fresh mint green on soft white."
version     = "1.0.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.mint"
title      = "Mint"
path       = "theme.json"
appearance = "light"
