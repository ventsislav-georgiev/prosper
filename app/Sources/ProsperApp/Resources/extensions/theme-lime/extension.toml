[extension]
id          = "com.prosper.theme.lime"
name        = "theme-lime"
title       = "Lime Theme"
description = "Acid lime on black moss, with a cool blue counter-accent."
version     = "1.0.0"
author      = "prosper"
license     = "MIT"
icon        = "paintpalette.fill"
system      = true

[extension.host]
min_version = "2.0.0"
api_level   = 1

[extension.entry]
main = "init.lua"

[extension.activation]
on_event = []
eager    = false

[[contributes.themes]]
id         = "com.prosper.theme.lime"
title      = "Lime"
path       = "theme.json"
appearance = "dark"
